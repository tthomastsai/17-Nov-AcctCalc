<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>計算機</title>
<style>
@font-face { font-family: "Google Sans"; font-weight: 400; src: url("fonts/google-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Google Sans"; font-weight: 500; src: url("fonts/google-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Google Sans"; font-weight: 700; src: url("fonts/google-sans-latin-700-normal.woff2") format("woff2"); }

:root {
  --u: min(1vw, 0.5vh);           /* 1 design unit */
  --bg: #f5f2ed;
  --body: #f5f2ed;
  --edge: #c3c6c9;
  --gray: #8e9296;
  --gray-d: #63676b;
  --white: #fbfaf7;
  --white-d: #c4c1bc;
  --yellow: #f8c700;
  --yellow-d: #c79c00;
  --ink: #575c62;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: manipulation; }
body {
  font-family: "Google Sans", "Product Sans", Roboto, system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.calc {
  position: relative;
  width: calc(var(--u) * 100);
  height: min(calc(100vh - var(--u) * 8), calc(var(--u) * 205));
  padding: calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 7);
  display: flex; flex-direction: column;
}

/* ---------- top: label + solar + LCD ---------- */
.head { display: flex; align-items: flex-start; justify-content: space-between; height: calc(var(--u) * 15); padding: 0 calc(var(--u) * 1.5); }
.label { color: #7a8088; font-weight: 500; font-size: calc(var(--u) * 2.5); letter-spacing: .14em; line-height: 1.5; margin-top: calc(var(--u) * 1.5); }
.label b { display: block; color: #3d5a8c; font-weight: 700; font-size: calc(var(--u) * 3.4); letter-spacing: .06em; }
.solarbox { display: flex; flex-direction: column; align-items: center; }
.solar {
  width: calc(var(--u) * 30); height: calc(var(--u) * 7.2);
  background: linear-gradient(180deg, #2a2423, #171313 60%, #241e1d);
  border-radius: calc(var(--u) * .6);
  box-shadow: inset 0 0 0 calc(var(--u) * .35) #0d0a0a, 0 calc(var(--u) * .3) 0 #e2ded8;
  position: relative; overflow: hidden;
}
.solar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--u) * 7.2), rgba(255,255,255,.05) calc(var(--u) * 7.2) calc(var(--u) * 7.5)); }
.tp { color: #6e747b; font-size: calc(var(--u) * 1.9); letter-spacing: .12em; margin-top: calc(var(--u) * 1); font-weight: 500; }
.sub { display: flex; justify-content: flex-end; padding: 0 calc(var(--u) * 1.5); margin-top: calc(var(--u) * -1.6); height: calc(var(--u) * 4.5); }
.d12 { color: #3d5a8c; font-style: italic; font-weight: 700; font-size: calc(var(--u) * 2.8); }

.bezel {
  background: linear-gradient(180deg, #fbf9f5, #ece8e2);
  border-radius: calc(var(--u) * 2.2);
  padding: calc(var(--u) * 1.6);
  box-shadow: 0 0 0 calc(var(--u) * .35) #e0dcd5, inset 0 calc(var(--u) * -.4) calc(var(--u) * .6) rgba(0,0,0,.06);
}
.lcd-frame { background: #5d666e; border-radius: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.1); }
.lcd {
  position: relative;
  height: calc(var(--u) * 22.5);
  border-radius: calc(var(--u) * .6);
  background: linear-gradient(170deg, #b9bfb6 0%, #a9afa6 55%, #a2a89f 100%);
  box-shadow: inset 0 calc(var(--u) * .8) calc(var(--u) * 1.2) rgba(0,0,0,.28);
  padding: calc(var(--u) * 2.2) calc(var(--u) * 2.4) calc(var(--u) * 2.4);
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden;
}
.lcd::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.18), transparent 40%); pointer-events: none; }
.ind { position: absolute; left: calc(var(--u) * 2.4); right: calc(var(--u) * 2.4); top: calc(var(--u) * 1.3);
  display: flex; align-items: flex-start; gap: calc(var(--u) * 2.2); color: #1d2320; z-index: 1; }
/* printed labels on the glass, with a segment bar that lights under the active one */
.lab { display: flex; flex-direction: column; align-items: center; }
.lab em { font-style: normal; font-weight: 500; font-size: calc(var(--u) * 2); letter-spacing: .05em; opacity: .62; white-space: nowrap; }
.lab b { width: calc(var(--u) * 4.6); height: calc(var(--u) * 1); border-radius: calc(var(--u) * .2); margin-top: calc(var(--u) * .7); background: currentColor; opacity: .05; }
.lab.on b { opacity: .9; }
/* pending operator (+ − × ÷) in the top-right corner */
#iOp { margin-left: auto; font-weight: 500; font-size: calc(var(--u) * 5); line-height: .8; opacity: 0; min-width: 1em; text-align: center; }
#iOp.on { opacity: .9; }
#num { text-align: right; white-space: nowrap; color: #1d2320; opacity: .9;
  font-weight: 400; font-size: calc(var(--u) * 10.5); line-height: 1; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
#num.off { visibility: hidden; }

/* ---------- keys ---------- */
.keys {
  flex: 1;
  margin-top: calc(var(--u) * 6);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(6, 1fr);
  column-gap: calc(var(--u) * 3.4);
  row-gap: calc(var(--u) * 3.6);
}
.k {
  --face: var(--white); --side: var(--white-d); --txt: var(--ink);
  position: relative;
  border: none; outline: none; padding: 0; margin: 0;
  border-radius: calc(var(--u) * 3);
  background: var(--face);
  color: var(--txt);
  font-family: inherit; font-weight: 400;
  font-size: calc(var(--u) * 6.4);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow:
    0 calc(var(--u) * 1.1) 0 var(--side),
    0 calc(var(--u) * 1.6) calc(var(--u) * 1.4) rgba(0,0,0,.22),
    inset 0 calc(var(--u) * .4) 0 rgba(255,255,255,.55),
    inset 0 calc(var(--u) * -.6) calc(var(--u) * .8) rgba(0,0,0,.06);
  transition: transform 40ms, box-shadow 40ms;
}
.k.down {
  transform: translateY(calc(var(--u) * .9));
  box-shadow:
    0 calc(var(--u) * .25) 0 var(--side),
    0 calc(var(--u) * .5) calc(var(--u) * .7) rgba(0,0,0,.2),
    inset 0 calc(var(--u) * .4) 0 rgba(255,255,255,.4);
}
.k.g { --face: var(--gray); --side: var(--gray-d); --txt: #fff; font-size: calc(var(--u) * 7.4); }
.k.y { --face: var(--yellow); --side: var(--yellow-d); --txt: #4f4210; }
.k.g { background: linear-gradient(180deg, #979b9f, #888c90); }
.k.y { background: linear-gradient(180deg, #fccd12, #f2c000); }
.k.w { background: linear-gradient(180deg, #ffffff, #f2f0ec); }
.k.sm { font-size: calc(var(--u) * 5); font-weight: 500; letter-spacing: -.02em; }
.k.xs { font-size: calc(var(--u) * 4.2); font-weight: 500; }
.k.op { font-size: calc(var(--u) * 8); font-weight: 400; }
.k.tall { grid-row: span 2; }
.k svg { width: 42%; height: 42%; }
.k .on2 { display: flex; flex-direction: column; align-items: center; font-size: calc(var(--u) * 3.6); font-weight: 700; line-height: 1.05; }
.k .on2 i { font-style: normal; border-top: calc(var(--u) * .45) solid currentColor; padding-top: calc(var(--u) * .4); margin-top: calc(var(--u) * .4); font-size: calc(var(--u) * 3.3); }
.k.ac { font-size: calc(var(--u) * 6.4); font-weight: 500; }
.k.pm { font-size: calc(var(--u) * 5); font-weight: 500; }
</style>
</head>
<body>
<div class="calc" id="calc">

  <div class="head">
    <div class="label"><b>CALCULATOR</b>ELECTRONIC</div>
    <div class="solarbox"><div class="solar"></div><div class="tp">TWO POWER</div></div>
  </div>
  <div class="sub"><span class="d12">12 digits</span></div>

  <div class="bezel"><div class="lcd-frame"><div class="lcd">
    <div class="ind">
      <span class="lab" id="iNeg"><em>MINUS</em><b></b></span>
      <span class="lab" id="iM"><em>MEMORY</em><b></b></span>
      <span class="lab" id="iE"><em>ERROR</em><b></b></span>
      <span class="lab" id="iGT"><em>GRAND TOTAL</em><b></b></span>
      <span id="iOp"></span>
    </div>
    <div id="num">0</div>
  </div></div></div>

  <div class="keys" id="keys">
    <!-- row 1 -->
    <button class="k w" data-k="back" aria-label="退格"><svg viewBox="0 0 20 20"><path d="M5 3 L16 10 L5 17 Z" fill="currentColor"/></svg></button>
    <button class="k w" data-k="sqrt" aria-label="開根號"><svg viewBox="0 0 24 20"><path d="M2 11 L5.5 9.5 L9.5 17.5 L14.5 2.5 L23 2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button class="k w sm" data-k="pct" style="font-size:calc(var(--u)*6)">%</button>
    <button class="k w sm" data-k="gt">GT</button>
    <button class="k w xs" data-k="off">OFF</button>
    <!-- row 2 -->
    <button class="k w sm" data-k="mc">MC</button>
    <button class="k w sm" data-k="mr">MR</button>
    <button class="k w sm" data-k="mminus">M−</button>
    <button class="k w sm" data-k="mplus">M+</button>
    <button class="k w op" data-k="div">÷</button>
    <!-- row 3 -->
    <button class="k w pm" data-k="neg">+/−</button>
    <button class="k g" data-k="7">7</button>
    <button class="k g" data-k="8">8</button>
    <button class="k g" data-k="9">9</button>
    <button class="k w op" data-k="mul">×</button>
    <!-- row 4 -->
    <button class="k y ac" data-k="ac">AC</button>
    <button class="k g" data-k="4">4</button>
    <button class="k g" data-k="5">5</button>
    <button class="k g" data-k="6">6</button>
    <button class="k w op" data-k="sub">−</button>
    <!-- row 5 -->
    <button class="k y" data-k="onc"><span class="on2">ON<i>C·CE</i></span></button>
    <button class="k g" data-k="1">1</button>
    <button class="k g" data-k="2">2</button>
    <button class="k g" data-k="3">3</button>
    <button class="k w op tall" data-k="add">+</button>
    <!-- row 6 -->
    <button class="k g" data-k="0">0</button>
    <button class="k g" data-k="00" style="font-size:calc(var(--u)*6.4)">00</button>
    <button class="k g" data-k="dot" style="font-size:calc(var(--u)*12)">·</button>
    <button class="k w op" data-k="eq">=</button>
  </div>
</div>

<script>
(function () {
"use strict";


/* ================= calculator state ================= */
const MAXD = 12;
let S;
function fresh() {
  return { entry: "0", full: null, acc: 0, op: null, newEntry: true, typed: false,
           kOp: null, kVal: null, err: false, on: true };
}
let mem = 0, gt = 0;
try { mem = parseFloat(localStorage.getItem("mem")) || 0; gt = parseFloat(localStorage.getItem("gt")) || 0; } catch (e) {}
function save() { try { localStorage.setItem("mem", mem); localStorage.setItem("gt", gt); } catch (e) {} }
S = fresh();

/* format a number into at most 12 digits; overflow => error with mantissa (Casio style) */
function fmt(x) {
  if (!isFinite(x)) return { str: "0", err: true };
  let err = false;
  if (Math.abs(x) >= 1e12) { err = true; x = x / 1e12; if (Math.abs(x) >= 1e12) return { str: "0", err: true }; }
  const a = Math.abs(x);
  const intDigits = a < 1 ? 1 : String(Math.floor(a)).length;
  let s = x.toFixed(Math.max(0, MAXD - intDigits));
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  if (s.replace(/[-.]/g, "").length > MAXD) { // rounding carried into a 13th digit
    if (err) return { str: "0", err: true };
    return fmt(parseFloat(s));
  }
  if (/^-0(\.0*)?$/.test(s)) s = "0";
  return { str: s, err: err };
}
// keep full internal precision for computed results (so 1 ÷ 3 × 3 = 1), display is rounded
const cur = () => (S.full !== null ? S.full : (parseFloat(S.entry) || 0));
const round = x => { const f = fmt(x); return f.err ? x : parseFloat(f.str); };

function show(x) {
  const f = fmt(x);
  S.entry = f.str;
  S.full = f.err ? null : x;
  if (f.err) S.err = true;
  S.newEntry = true;
}
function calc(a, op, b) {
  switch (op) {
    case "add": return a + b;
    case "sub": return a - b;
    case "mul": return a * b;
    case "div": return b === 0 ? NaN : a / b;
  }
  return b;
}

function digit(d) {
  S.full = null;
  if (S.newEntry) { S.entry = "0"; S.newEntry = false; }
  S.typed = true;
  const neg = S.entry[0] === "-";
  const body = neg ? S.entry.slice(1) : S.entry;
  if (body === "0") { S.entry = (neg ? "-" : "") + d; return; }
  if (body.replace(".", "").length >= MAXD) return;
  S.entry += d;
}
function dot() {
  S.full = null;
  if (S.newEntry) { S.entry = "0."; S.newEntry = false; S.typed = true; return; }
  S.typed = true;
  if (S.entry.indexOf(".") < 0 && S.entry.replace(/[-.]/g, "").length < MAXD) S.entry += ".";
}
function operator(o) {
  if (S.op && S.typed) {
    show(calc(S.acc, S.op, cur()));
    if (S.err) return;
  }
  S.acc = cur();
  S.op = o; S.newEntry = true; S.typed = false;
}
function equals() {
  let r, counted = true;
  if (S.op) {
    const a = S.acc, b = cur();
    if (S.op === "div" && !S.typed) r = a === 0 ? NaN : 1 / a;   // 5 ÷ = -> 0.2
    else r = calc(a, S.op, b);
    // constant calculation: × keeps the first number, + − ÷ keep the second
    if (S.op === "mul") { S.kOp = "mul"; S.kVal = a; } else { S.kOp = S.op; S.kVal = b; }
    S.op = null;
  } else if (S.kOp) {
    const x = cur();
    r = S.kOp === "mul" ? S.kVal * x : calc(x, S.kOp, S.kVal);
  } else { r = cur(); counted = false; }
  show(r);
  if (!S.err && counted) { gt = round(gt + cur()); save(); }
  S.acc = cur(); S.typed = false;
}
function percent() {
  const x = cur();
  let r;
  if (S.op) {
    const a = S.acc;
    switch (S.op) {
      case "mul": r = a * x / 100; break;          // 200 × 15 % = 30
      case "div": r = a / x * 100; break;          // 30 ÷ 200 % = 15
      case "add": r = a + a * x / 100; break;      // 200 + 10 % = 220 (加成)
      case "sub": r = a - a * x / 100; break;      // 200 − 10 % = 180 (折扣)
    }
    if (S.op === "div" && x === 0) r = NaN;
    S.op = null;
    show(r);
    if (!S.err) { gt = round(gt + cur()); save(); }
  } else {
    show(x / 100);
  }
  S.acc = cur(); S.typed = false;
}
function memAdd(sign) {
  if (S.op && S.typed) equals();
  if (S.err) return;
  mem = round(mem + sign * cur()); save();
  S.newEntry = true; S.typed = false;
}

function press(k) {
  if (!S.on) { if (k === "onc") { S = fresh(); } render(); return; }
  if (k === "off") { S = fresh(); S.on = false; render(); return; }
  if (k === "ac") { S = fresh(); gt = 0; save(); render(); return; }
  if (k === "onc") {
    if (S.err) {
      const keep = S.entry;
      S = fresh(); S.entry = keep; S.full = parseFloat(keep);
    }
    else if (!S.newEntry && S.typed) { S.entry = "0"; S.full = null; S.newEntry = true; S.typed = false; } // CE
    else { S = fresh(); }                                                                // C
    render(); return;
  }
  if (S.err) { render(); return; }   // locked until C / AC

  if (/^[0-9]$/.test(k)) digit(k);
  else switch (k) {
    case "00": digit("0"); digit("0"); break;
    case "dot": dot(); break;
    case "back":
      if (!S.newEntry) {
        S.entry = S.entry.slice(0, -1);
        if (S.entry === "" || S.entry === "-") { S.entry = "0"; }
      }
      break;
    case "neg":
      if (S.full !== null) S.full = -S.full;
      if (S.entry[0] === "-") S.entry = S.entry.slice(1);
      else if (cur() !== 0 || S.entry.indexOf(".") >= 0) S.entry = "-" + S.entry;
      S.typed = true;
      break;
    case "add": case "sub": case "mul": case "div": operator(k); break;
    case "eq": equals(); break;
    case "pct": percent(); break;
    case "sqrt": {
      const x = cur();
      if (x < 0) { S.entry = "0"; S.full = null; S.err = true; }
      else show(Math.sqrt(x));
      S.typed = true;
      break;
    }
    case "mplus": memAdd(1); break;
    case "mminus": memAdd(-1); break;
    case "mr": show(mem); S.typed = true; break;
    case "mc": mem = 0; save(); break;
    case "gt": show(gt); S.typed = true; break;
  }
  render();
}

/* ================= render ================= */
function render() {
  const on = S.on;
  let t = S.entry, neg = false;
  if (t[0] === "-") { neg = true; t = t.slice(1); }
  const num = document.getElementById("num");
  // a full 12-digit negative number has no room for the sign, so it moves to the indicator row
  const full12 = t.replace(".", "").length >= MAXD;
  const dp = t.indexOf(".");
  let ip = dp < 0 ? t : t.slice(0, dp), fp = dp < 0 ? "" : t.slice(dp + 1);
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  num.textContent = (neg && !full12 ? "−" : "") + ip + "." + fp;
  num.classList.toggle("off", !on);
  // shrink to fit if ever needed
  num.style.fontSize = "";
  if (num.scrollWidth > num.clientWidth) num.style.fontSize = (parseFloat(getComputedStyle(num).fontSize) * num.clientWidth / num.scrollWidth) + "px";
  const ind = (id, v) => document.getElementById(id).classList.toggle("on", on && v);
  ind("iM", mem !== 0); ind("iE", S.err); ind("iNeg", neg && full12); ind("iGT", gt !== 0);
  const OPS = { add: "+", sub: "−", mul: "×", div: "÷" };
  const io = document.getElementById("iOp");
  io.textContent = S.op ? OPS[S.op] : "";
  io.classList.toggle("on", on && !!S.op && !S.err);
}

/* ================= input ================= */
const vib = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} };
document.querySelectorAll(".k").forEach(b => {
  b.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    b.classList.add("down"); vib(); press(b.dataset.k);
  });
  const up = () => b.classList.remove("down");
  b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
  b.addEventListener("contextmenu", e => e.preventDefault());
});
/* hardware / desktop keyboard */
const KEYMAP = { "+": "add", "-": "sub", "*": "mul", "x": "mul", "/": "div", "=": "eq", "Enter": "eq",
  ".": "dot", "Backspace": "back", "Escape": "ac", "Delete": "onc", "%": "pct" };
document.addEventListener("keydown", e => {
  const k = /^[0-9]$/.test(e.key) ? e.key : KEYMAP[e.key];
  if (k) { e.preventDefault(); press(k); }
});

window.calcPress = press;                    // for testing
window.calcState = () => ({ entry: S.entry, err: S.err, mem: mem, gt: gt, on: S.on });
render();
})();
</script>
</body>
</html>
