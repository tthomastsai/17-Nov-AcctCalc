<style>

html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F2ED; touch-action: manipulation; }
body { font-family: "Google Sans", Roboto, system-ui, sans-serif; }
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }

/* ---------- settings sheet ---------- */
#sheet { position: fixed; inset: 0; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 5; }
#sheet .page { max-width: 560px; margin: 0 auto; padding: 8px 16px 28px; box-sizing: border-box; }
#sheet.open { display: block; }
#sheet .bar { display: flex; align-items: center; padding: 4px 0 12px; }
#sheet .bar button { width: 44px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#sheet .head { font-size: 13px; font-weight: 700; margin: 18px 6px 8px; }
#sheet .card { border-radius: 20px; padding: 16px 18px; }
#sheet .row { display: flex; align-items: center; padding: 8px 0; cursor: pointer; font-size: 15px; font-weight: 500; }
#sheet .row .grow { flex: 1; }
#sheet .hint { font-size: 12px; font-weight: 500; margin-top: 6px; }
#sheet .para { font-size: 14px; font-weight: 500; line-height: 1.45; margin: 0 0 8px; }
#sheet h2 { margin: 0 0 0 4px; font-size: 24px; font-weight: 700; }
.sec { font-size: 15px; font-weight: 500; margin: 14px 0 8px; display: flex; justify-content: space-between; }
.sec.first { margin-top: 0; }
.sec span:last-child { opacity: .75; }
.seg { display: flex; padding: 3px; border-radius: 20px; }
.seg button { flex: 1; border: 0; background: transparent; font: 500 14px/1 inherit; font-family: inherit; padding: 9px 6px; border-radius: 17px; cursor: pointer; color: inherit; }
input[type=range] { width: 100%; margin: 6px 0 2px; }
.sw { display: flex; }
.sw button { flex: 1; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; font: 500 11px inherit; font-family: inherit; cursor: pointer; color: inherit; }
.sw canvas { width: 48px; height: 48px; }
.sw span { margin-top: 6px; }
.tg { -webkit-appearance: none; appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--off); position: relative; cursor: pointer; flex: none; margin: 0 0 0 12px; transition: background .15s; opacity: .9; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.tg:checked { background: var(--on); }
.tg:checked::after { left: 19px; }
#tour { position: fixed; inset: 0; display: none; z-index: 10; }
#tour.open { display: block; }
#tour.nohole { background: rgba(0,0,0,.6); }
#tourHole { position: absolute; box-shadow: 0 0 0 200vmax rgba(0,0,0,.6); outline: 2px solid rgba(255,255,255,.9); pointer-events: none; }
#tour.nohole #tourHole { display: none; }
#tourCard { position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 440px; border-radius: 22px; padding: 20px; box-sizing: border-box; }
#tourCard h3 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
#tourCard p { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; }
#tourCard .trow { display: flex; align-items: center; margin-top: 18px; }
#tourCard .trow span { margin-left: auto; margin-right: 14px; font-size: 13px; font-weight: 500; }
#tourCard button { border: 0; background: transparent; font: 700 15px inherit; font-family: inherit; cursor: pointer; padding: 12px 8px; margin-left: -8px; }
#tourCard button.next { border-radius: 22px; padding: 12px 18px; margin: 0; }

<body>
<canvas id="c" aria-label="Calculator"></canvas>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="tour" role="dialog" aria-modal="true"><div id="tourHole"></div><div id="tourCard"></div></div>

<script>
"use strict";
/* ENGINE START — port of app/src/tw/thomas/calc/CalcEngine.java (keep the two in step) */
function CalcEngine() {
  const MAXD = 12;
  const E = this;
  E.mem = 0; E.gt = 0; E.onSave = null;
  let entry, hasFull, full, acc, op, newEntry, typed, kOp, kVal, err, on, lastKey = null;
  function fresh() { entry = "0"; hasFull = false; full = 0; acc = 0; op = null; newEntry = true; typed = false; kOp = null; kVal = 0; err = false; on = true; }
  fresh();
  const save = () => { if (E.onSave) E.onSave(E.mem, E.gt); };

  // plain decimal string of a double, like Java's BigDecimal.valueOf(x).toPlainString()
  function plain(x) {
    let s = String(x);
    if (!/e/i.test(s)) return s;
    const neg = s[0] === "-"; if (neg) s = s.slice(1);
    let [m, ex] = s.split(/e/i); ex = parseInt(ex, 10);
    let [ip, fp = ""] = m.split(".");
    let digits = ip + fp, point = ip.length + ex;
    if (point <= 0) s = "0." + "0".repeat(-point) + digits;
    else if (point >= digits.length) s = digits + "0".repeat(point - digits.length);
    else s = digits.slice(0, point) + "." + digits.slice(point);
    return (neg ? "-" : "") + s;
  }
  // HALF_UP rounding on the decimal string (Java RoundingMode.HALF_UP)
  function setScale(x, scale) {
    let s = plain(x), neg = s[0] === "-"; if (neg) s = s.slice(1);
    let [ip, fp = ""] = s.split(".");
    fp = (fp + "0".repeat(scale + 1)).slice(0, scale + 1);
    const roundUp = fp[scale] >= "5";
    let digits = (ip + fp.slice(0, scale)).split("").map(Number);
    if (roundUp) {
      let i = digits.length - 1;
      while (i >= 0) { if (digits[i] === 9) { digits[i] = 0; i--; } else { digits[i]++; break; } }
      if (i < 0) digits.unshift(1);
    }
    let str = digits.join("");
    let intLen = str.length - scale;
    let out = scale > 0 ? str.slice(0, intLen) + "." + str.slice(intLen) : str;
    out = out.replace(/^0+(?=\d)/, "");
    return (neg ? "-" : "") + out;
  }
  function fmt(x) {
    if (!isFinite(x)) return { str: "0", err: true };
    let e = false;
    if (Math.abs(x) >= 1e12) { e = true; x = x / 1e12; if (Math.abs(x) >= 1e12) return { str: "0", err: true }; }
    const a = Math.abs(x);
    const intDigits = a < 1 ? 1 : String(Math.floor(a)).length;
    let s = setScale(x, Math.max(0, MAXD - intDigits));
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    if (s.replace("-", "").replace(".", "").length > MAXD) {
      if (e) return { str: "0", err: true };
      return fmt(parseFloat(s));
    }
    if (/^-0(\.0*)?$/.test(s)) s = "0";
    return { str: s, err: e };
  }
  const parse = s => { const v = parseFloat(s); return isNaN(v) ? 0 : v; };
  const cur = () => hasFull ? full : parse(entry);
  const round = x => { const f = fmt(x); return f.err ? x : parseFloat(f.str); };
  function show(x) { const f = fmt(x); entry = f.str; hasFull = !f.err; full = x; if (f.err) err = true; newEntry = true; }
  function calc(a, o, b) {
    if (o === "add") return a + b;
    if (o === "sub") return a - b;
    if (o === "mul") return a * b;
    if (o === "div") return b === 0 ? NaN : a / b;
    return b;
  }
  function digit(d) {
    hasFull = false;
    if (newEntry) { entry = "0"; newEntry = false; }
    typed = true;
    const neg = entry[0] === "-", body = neg ? entry.slice(1) : entry;
    if (body === "0") { entry = (neg ? "-" : "") + d; return; }
    if (body.replace(".", "").length >= MAXD) return;
    entry += d;
  }
  function dot() {
    hasFull = false;
    if (newEntry) { entry = "0."; newEntry = false; typed = true; return; }
    typed = true;
    if (entry.indexOf(".") < 0 && entry.replace("-", "").replace(".", "").length < MAXD) entry += ".";
  }
  function operator(o) {
    if (op !== null && typed) { show(calc(acc, op, cur())); if (err) return; }
    acc = cur(); op = o; newEntry = true; typed = false;
  }
  function equals(toGt) {
    if (toGt === undefined) toGt = true;   // false when finished by M+ / M− (not added to GT)
    let r, counted = toGt;
    if (op !== null) {
      const a = acc, b = cur();
      if (op === "div" && !typed) r = a === 0 ? NaN : 1 / a;
      else r = calc(a, op, b);
      if (op === "mul") { kOp = "mul"; kVal = a; } else { kOp = op; kVal = (op === "div" && !typed) ? a : b; }
      op = null;
    } else if (kOp !== null) {
      const x = cur();
      r = kOp === "mul" ? kVal * x : calc(x, kOp, kVal);
    } else { r = cur(); }                 // "5 =" with nothing pending still counts towards GT, as on the real calculator
    show(r);
    if (!err && counted) { E.gt = round(E.gt + cur()); save(); }
    acc = cur(); typed = false;
  }
  function percent() {
    const x = cur(); let r;
    if (op !== null) {
      const a = acc;
      if (op === "mul") r = a * x / 100;
      else if (op === "div") r = x === 0 ? NaN : a / x * 100;
      else if (op === "add") r = a + a * x / 100;
      else r = a - a * x / 100;
      op = null;
      show(r);
      if (!err) { E.gt = round(E.gt + cur()); save(); }
    } else show(x / 100);
    acc = cur(); typed = false;
  }
  function memAdd(sign) {
    if (op !== null && typed) equals(false);
    if (err) return;
    E.mem = round(E.mem + sign * cur()); save();
    newEntry = true; typed = false;
  }
  E.press = function (k) {
    const prev = lastKey; lastKey = k;
    if (!on) { if (k === "onc") fresh(); return; }
    if (k === "off") { fresh(); on = false; return; }
    if (k === "ac") { fresh(); E.gt = 0; E.mem = 0; save(); return; }
    if (k === "onc") {
      if (err) { const keep = entry; fresh(); entry = keep; hasFull = true; full = parse(keep); }
      else if (!newEntry && typed) { entry = "0"; hasFull = false; newEntry = true; typed = false; }
      else fresh();
      return;
    }
    if (err) return;
    if (/^[0-9]$/.test(k)) { digit(k); return; }
    switch (k) {
      case "00": digit("0"); digit("0"); break;
      case "dot": dot(); break;
      case "back":
        if (!newEntry) { entry = entry.slice(0, -1); if (entry === "" || entry === "-") entry = "0"; }
        break;
      case "neg":
        if (hasFull) full = -full;
        if (entry[0] === "-") entry = entry.slice(1);
        else if (cur() !== 0 || entry.indexOf(".") >= 0) entry = "-" + entry;
        typed = true;
        break;
      case "add": case "sub": case "mul": case "div": operator(k); break;
      case "eq": equals(); break;
      case "pct": percent(); break;
      case "sqrt": { const x = cur(); if (x < 0) { entry = "0"; hasFull = false; err = true; } else show(Math.sqrt(x)); typed = true; break; }
      case "mplus": memAdd(1); break;
      case "mminus": memAdd(-1); break;
      case "mr": show(E.mem); typed = true; break;
      case "mc": E.mem = 0; save(); break;
      case "gt":
        if (prev === "gt") { E.gt = 0; save(); }
        else { show(E.gt); typed = true; }
        break;
    }
  };
  E.entry = () => entry;
  E.err = () => err;
  E.on = () => on;
  E.op = () => (err ? null : op);
  E.isNegative = () => entry[0] === "-";
  E.isFull12 = () => (entry[0] === "-" ? entry.slice(1) : entry).replace(".", "").length >= MAXD;
  E.displayDigits = () => {
    const t = entry[0] === "-" ? entry.slice(1) : entry, dp = t.indexOf(".");
    const ip = dp < 0 ? t : t.slice(0, dp), fp = dp < 0 ? "" : t.slice(dp + 1);
    let sb = "";
    for (let i = 0; i < ip.length; i++) { if (i > 0 && (ip.length - i) % 3 === 0) sb += "'"; sb += ip[i]; }
    return sb + "." + fp;
  };
}
/* ENGINE END */
if (typeof module !== "undefined") module.exports = { CalcEngine };
</script>

/* ================= storage ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },

};
const sysLang = () => ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en-GB");
